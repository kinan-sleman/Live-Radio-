<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <style>
      .bg { fill: #080b0e; }
      .map-land { fill: #11161b; stroke: #171e24; stroke-width: 1; }
      .console-bg { fill: #0d1117; fill-opacity: 0.85; stroke: #21262d; stroke-width: 2; rx: 12px; }
      .text-main { fill: #f0f6fc; font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .text-accent-green { fill: #00ffaa; font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: bold; }
      .text-accent-cyan { fill: #00bfff; font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .text-muted { fill: #8b949e; font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .glow-cyan { filter: drop-shadow(0px 0px 8px rgba(0, 191, 255, 0.8)); }
      .glow-green { filter: drop-shadow(0px 0px 8px rgba(0, 255, 170, 0.8)); }
      .pulse { animation: blink 1.5s infinite; }
    </style>

        <filter id="blur-gate">
            <feGaussianBlur stdDeviation="4" />
        </filter>
    </defs>

    <rect width="1200" height="630" class="bg" />

    <g id="map-shapes" opacity="0.6">
        <path d="M 100,100 Q 180,80 250,120 T 300,250 Q 250,350 150,320 T 80,200 Z" class="map-land" />
        <path d="M 200,350 Q 280,380 250,480 T 300,580 Q 220,580 180,480 Z" class="map-land" />
        <path d="M 450,80 Q 600,50 800,100 T 950,220 Q 800,300 700,250 T 500,150 Z" class="map-land" />
        <path d="M 500,250 Q 650,240 620,380 T 680,550 Q 550,580 480,450 Z" class="map-land" />
        <path d="M 850,450 Q 950,430 980,500 T 880,550 Z" class="map-land" />
    </g>

    <g id="markers">
        <circle cx="580" cy="180" r="7" fill="#00bfff" class="glow-cyan" />
        <path d="M 580,180 L 575,160 Q 580,155 585,160 Z" fill="#00bfff" class="glow-cyan" />

        <circle cx="220" cy="220" r="7" fill="#00bfff" class="glow-cyan" />
        <circle cx="520" cy="380" r="7" fill="#00bfff" class="glow-cyan" />
        <circle cx="610" cy="420" r="7" fill="#00bfff" class="glow-cyan" />

        <circle cx="560" cy="220" r="16" fill="#00ffaa" fill-opacity="0.2" stroke="#00ffaa"
            stroke-width="2" class="glow-green" />
        <text x="560" y="225" font-size="14" text-anchor="middle" class="text-accent-green">3</text>

        <circle cx="710" cy="310" r="20" fill="#00ffaa" fill-opacity="0.2" stroke="#00ffaa"
            stroke-width="2" class="glow-green" />
        <text x="710" y="315" font-size="16" text-anchor="middle" class="text-accent-green">12</text>
    </g>

    <g id="console" transform="translate(730, 60)">
        <rect width="420" height="510" class="console-bg" />

        <circle cx="30" cy="35" r="5" fill="#00ffaa" class="glow-green pulse" />
        <text x="45" y="40" font-size="18" font-weight="700" class="text-main">GEO-STREAM v3.0</text>

        <rect x="270" y="20" width="120" height="26" rx="6" fill="#00ffaa" fill-opacity="0.1"
            stroke="#00ffaa" stroke-width="1" />
        <text x="330" y="37" font-size="11" text-anchor="middle" class="text-accent-green">STREAMING
            ACTIVE</text>

        <line x1="20" y1="70" x2="400" y2="70" stroke="#21262d" stroke-width="1" />

        <text x="20" y="105" font-size="12" class="text-muted">REGION:</text>
        <text x="90" y="105" font-size="14" font-weight="bold" class="text-accent-cyan">GLOBAL NODE
            ACTIVE</text>

        <text x="20" y="155" font-size="13" font-weight="bold" class="text-muted">LIVE CHANNELS
            FETCHED</text>
        <rect x="365" y="142" width="35" height="18" rx="4" fill="#161b22" />
        <text x="382" y="155" font-size="11" text-anchor="middle" class="text-main">30</text>

        <g transform="translate(20, 180)">
            <rect width="380" height="55" rx="6" fill="#1f242c" stroke="#00ffaa" stroke-width="1" />
            <text x="15" y="25" font-size="14" font-weight="bold" class="text-accent-green">Sham FM
                Live</text>
            <text x="15" y="43" font-size="11" class="text-muted">#LIVE STREAMING</text>
            <rect x="310" y="17" width="55" height="20" rx="4" fill="#00ffaa" fill-opacity="0.1" />
            <text x="337" y="31" font-size="11" text-anchor="middle" class="text-accent-green">320k</text>
        </g>

        <g transform="translate(20, 245)">
            <rect width="380" height="55" rx="6" fill="#161b22" />
            <text x="15" y="25" font-size="14" class="text-main">Radio Paradise Mix</text>
            <text x="15" y="43" font-size="11" class="text-muted">#ECLECTIC rock</text>
            <rect x="310" y="17" width="55" height="20" rx="4" fill="#21262d" />
            <text x="337" y="31" font-size="11" text-anchor="middle" class="text-muted">320k</text>
        </g>

        <g transform="translate(20, 310)">
            <rect width="380" height="55" rx="6" fill="#161b22" />
            <text x="15" y="25" font-size="14" class="text-main">Classic Vinyl HD</text>
            <text x="15" y="43" font-size="11" class="text-muted">#ROCK 60S 70S</text>
            <rect x="310" y="17" width="55" height="20" rx="4" fill="#21262d" />
            <text x="337" y="31" font-size="11" text-anchor="middle" class="text-muted">96k</text>
        </g>

        <g transform="translate(20, 390)">
            <line x1="0" y1="0" x2="380" y2="0" stroke="#21262d" stroke-width="1" />

            <rect x="10" y="25" width="3" height="15" fill="#00ffaa" />
            <rect x="18" y="15" width="3" height="30" fill="#00ffaa" />
            <rect x="26" y="20" width="3" height="22" fill="#00ffaa" />
            <rect x="34" y="10" width="3" height="40" fill="#00ffaa" />
            <rect x="42" y="22" width="3" height="18" fill="#00ffaa" />

            <text x="160" y="40" font-size="12" class="text-muted">VOL</text>
            <line x1="195" y1="36" x2="340" y2="36" stroke="#21262d" stroke-width="4"
                stroke-linecap="round" />
            <line x1="195" y1="36" x2="300" y2="36" stroke="#00bfff" stroke-width="4"
                stroke-linecap="round" />
            <circle cx="300" cy="36" r="6" fill="#f0f6fc" class="glow-cyan" />
        </g>
    </g>

    <text x="60" y="540" font-size="38" font-weight="bold" class="text-main" opacity="0.9">
        GEO-STREAM</text>
    <text x="60" y="575" font-size="16" letter-spacing="4" class="text-accent-cyan" opacity="0.8">GLOBAL
        REALTIME AUDIO ENGINE</text>
</svg>